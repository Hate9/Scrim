<svg xmlns="http://www.w3.org/2000/svg" width="560" height="420" viewBox="0 0 560 420" font-family="sans-serif" font-size="13">
  <title>Sidebar: files tree (left) and file list view (right)</title>
  <!-- tree -->
  <rect x="0" y="0" width="240" height="420" fill="#f3f2ee" stroke="#999"/>
  <text x="50" y="28" font-weight="bold">Files</text>
  <rect x="24" y="40" width="84" height="4" fill="#1f0909"/>
  <text x="150" y="28" fill="#555">Outline</text>
  <text x="200" y="28" fill="#555" font-size="11">☰</text>
  <text x="18" y="72">▾ notes</text>
  <text x="34" y="97">▸ archive</text>
  <rect x="0" y="105" width="239" height="24" fill="rgba(32,43,51,0.63)"/>
  <text x="34" y="122" fill="#fff">ideas.md</text>
  <text x="34" y="147">todo.md</text>
  <text x="18" y="172">readme.md</text>
  <line x1="0" y1="390" x2="240" y2="390" stroke="#ddd"/>
  <text x="10" y="410" fill="#428bca" font-size="16">+</text>
  <text x="90" y="410" fill="#777" font-size="12">notes</text>
  <text x="210" y="410" fill="#777">⋯</text>
  <!-- list view -->
  <rect x="300" y="0" width="240" height="420" fill="#f3f2ee" stroke="#999"/>
  <text x="350" y="28" font-weight="bold">Files</text>
  <rect x="324" y="40" width="84" height="4" fill="#1f0909"/>
  <text x="450" y="28" fill="#555">Outline</text>
  <g>
    <rect x="300" y="56" width="239" height="76" fill="rgba(32,43,51,0.63)"/>
    <text x="316" y="78" fill="#fff" font-weight="bold">Ideas</text>
    <text x="316" y="96" fill="#eee" font-size="11">2026-11-20</text>
    <text x="316" y="114" fill="#eee" font-size="12">First two lines of the file's text</text>
    <text x="316" y="128" fill="#eee" font-size="12">shown as an excerpt…</text>
  </g>
  <g>
    <text x="316" y="158" font-weight="bold">Todo</text>
    <text x="316" y="176" fill="#777" font-size="11">2026-11-18</text>
    <text x="316" y="194" fill="#555" font-size="12">Excerpt…</text>
    <line x1="310" y1="210" x2="530" y2="210" stroke="#ddd"/>
  </g>
</svg>
