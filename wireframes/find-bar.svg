<svg xmlns="http://www.w3.org/2000/svg" width="720" height="100" viewBox="0 0 720 100" font-family="sans-serif" font-size="12">
  <title>Find and replace bar (39 px per row)</title>
  <rect x="0" y="0" width="720" height="39" fill="#f3f2ee" stroke="#ddd"/>
  <text x="12" y="24" fill="#777">Find</text>
  <rect x="98" y="7" width="430" height="26" fill="#fff" stroke="#ccc"/>
  <text x="106" y="24" fill="#aaa">search text</text>
  <text x="472" y="24" fill="#888">3 of 17</text>
  <rect x="536" y="11" width="22" height="16" fill="none" stroke="#aaa" rx="2"/><text x="540" y="24" font-size="10">Aa</text>
  <rect x="562" y="11" width="22" height="16" fill="none" stroke="#aaa" rx="2"/><text x="566" y="24" font-size="10">ab</text>
  <rect x="588" y="11" width="22" height="16" fill="none" stroke="#aaa" rx="2"/><text x="593" y="24" font-size="10">.*</text>
  <text x="618" y="24">⋯</text>
  <text x="642" y="25">⌃</text><text x="664" y="25">⌄</text>
  <text x="700" y="25" font-size="14">×</text>
  <rect x="0" y="39" width="720" height="39" fill="#f3f2ee" stroke="#ddd"/>
  <text x="12" y="63" fill="#777">Replace</text>
  <rect x="98" y="46" width="400" height="26" fill="#fff" stroke="#ccc"/>
  <rect x="508" y="46" width="70" height="26" fill="#fff" stroke="#ccc"/><text x="520" y="63">Replace</text>
  <rect x="584" y="46" width="80" height="26" fill="#fff" stroke="#ccc"/><text x="592" y="63">Replace All</text>
</svg>
