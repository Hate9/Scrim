name: CI

on:
  workflow_dispatch:
  push:
    # Documents, spec pulls, and questions do not change what is built or tested.
    paths-ignore:
      - "spec/**"
      - "spec-questions/**"
      - "**/*.md"
      - "!tests/fixtures/**"
      - "!src-tauri/help/**"
      - "!THIRD_PARTY.md"
  pull_request:
    paths-ignore:
      - "spec/**"
      - "spec-questions/**"
      - "**/*.md"
      - "!tests/fixtures/**"
      - "!src-tauri/help/**"
      - "!THIRD_PARTY.md"

# A newer push to the same branch makes the running check moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev webkit2gtk-driver xvfb x11-utils dbus strace xclip xdotool
          # P5 export tests: pandoc (X-3, X-4), PDF text tools (X-2, X-5), LibreOffice
          # opens the docx (X-3), CJK and symbol (✓) fonts for the X-5 header (QA-LOG Q-024),
          # an English dictionary for spell check (L-1, L-2).
          sudo apt-get install -y --no-install-recommends pandoc poppler-utils unzip \
            libreoffice-writer-nogui fonts-noto-cjk fonts-dejavu-core imagemagick hunspell-en-us
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc --noEmit
      # Q-026: the parity test (src/md/rustparity.test.ts) needs Rust's block-tree helper;
      # without it the test is skipped, so build it first.
      - run: cargo build --release -p scrim-core --example block_tree
      - run: npm test
      - name: Rust and frontend block parsers agree (Q-026)
        run: test -x target/release/examples/block_tree && npx vitest run src/md/rustparity.test.ts
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: No HTTP client crates (N-1 / P8-1)
        run: scripts/check-no-http.sh
      - run: cargo install tauri-driver --version ^2 --locked
      - run: npx tauri build --debug --no-bundle
      - name: E2E under connection trace (S-1, S-3, N-1)
        # T-1 (fixture themes, network download) runs in goldens.yml.
        run: SCRIM_SKIP_BUILD=1 SCRIM_E2E_FILTER='^(?!T-1 )' scripts/n1-network.sh


  # P8-1 on Linux: the release .deb and AppImage install, register for Markdown, open a
  # file (S-1 against the installed binary), and uninstall cleanly.
  packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev webkit2gtk-driver xvfb x11-utils dbus xclip \
            desktop-file-utils libglib2.0-bin
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: cargo install tauri-driver --version ^2 --locked
      - run: npx tauri build --bundles deb appimage
      - run: scripts/check-linux-packages.sh
