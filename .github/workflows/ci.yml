name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev webkit2gtk-driver xvfb x11-utils dbus strace xclip
          # P5 export tests: pandoc (X-3, X-4), PDF text tools (X-2, X-5), LibreOffice
          # opens the docx (X-3), CJK and symbol (✓) fonts for the X-5 header (QA-LOG Q-024).
          sudo apt-get install -y --no-install-recommends pandoc poppler-utils unzip \
            libreoffice-writer-nogui fonts-noto-cjk fonts-dejavu-core imagemagick
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: No HTTP client crates (N-1 / P8-1)
        run: scripts/check-no-http.sh
      - run: cargo install tauri-driver --version ^2 --locked
      - run: npx tauri build --debug --no-bundle
      - name: E2E under connection trace (S-1, S-3, N-1)
        # T-1 (fixture themes, network download) runs in goldens.yml.
        run: SCRIM_SKIP_BUILD=1 SCRIM_E2E_FILTER='^(?!T-1 )' scripts/n1-network.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: cargo test --workspace
      - run: npx tauri build --debug --no-bundle
