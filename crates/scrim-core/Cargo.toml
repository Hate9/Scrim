[package]
name = "scrim-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Platform-independent core of Scrim: identity, file IO, encodings, logging."

[features]
default = ["theme-compat-rewrite"]
# THEME_COMPAT_REWRITE (spec 10, 10.3): rewrite compatible themes' selectors.
theme-compat-rewrite = []

[dependencies]
encoding_rs = "0.8"
chardetng = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
xattr = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
