[package]
name = "scrim"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Scrim, a live-preview Markdown editor"
default-run = "scrim"

[lib]
name = "scrim_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
scrim-core = { path = "../crates/scrim-core" }
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
clipboard-rs = "0.3"
base64 = "0.22"
notify = "8"
ignore = "0.4"
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
trash = "5"
natord = "1"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2"
# Same as tauri-plugin-single-instance: wait out an exiting instance (lib.rs).
zbus = { version = "5.9", default-features = false, features = ["blocking-api", "async-io"] }
gtk = "0.18"

[target.'cfg(windows)'.dependencies]
# Same versions as wry's, for the WebView2 settings in hardening.rs.
webview2-com = "0.39"
windows-core = "0.62"
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse"] }

[dev-dependencies]
tempfile = "3"
