<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scrim</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="notice" class="scrim-notice" role="status" hidden>
      <span id="notice-text"></span>
      <button id="notice-close" type="button" aria-label="Dismiss">×</button>

    <main id="write">
      <textarea id="editor" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="Document"></textarea>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
