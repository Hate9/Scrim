<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" font-family="sans-serif" font-size="12">
  <title>Main window: sidebar open, outline tab</title>
  <rect width="960" height="640" fill="#f3f2ee" stroke="#999"/>
  <!-- sidebar -->
  <rect x="0" y="0" width="240" height="640" fill="#f3f2ee"/>
  <line x1="240" y1="0" x2="240" y2="640" stroke="#1f0909" stroke-dasharray="3 3"/>
  <text x="54" y="28" fill="#555">Files</text>
  <text x="150" y="28" font-weight="bold">Outline</text>
  <rect x="131" y="40" width="84" height="4" fill="#1f0909"/>
  <g font-size="13">
    <text x="18" y="72" font-weight="bold">Heading One</text>
    <text x="32" y="97">Heading Two</text>
    <text x="46" y="122">Heading Three</text>
    <text x="60" y="147">Heading Four</text>
  </g>
  <text x="18" y="370" fill="#888" font-size="11">indent 14px / level · row pitch 25px</text>
  <!-- document column -->
  <rect x="300" y="0" width="580" height="610" fill="none" stroke="#bbb" stroke-dasharray="6 4"/>
  <text x="304" y="14" fill="#888" font-size="11">#write: text measure 580px (max-width 640 incl. 30px padding)</text>
  <text x="300" y="90" font-family="serif" font-size="30">Heading One</text>
  <line x1="300" y1="112" x2="880" y2="112" stroke="#c5c5c5"/>
  <text x="300" y="142" font-family="serif" font-size="16">Paragraph text in the column, serif 16/24 …</text>
  <text x="300" y="200" font-family="serif" font-size="21" font-weight="bold">Heading Two</text>
  <rect x="332" y="222" width="5" height="24" fill="#bababa"/>
  <text x="352" y="240" font-family="serif" font-size="16" font-style="italic" fill="#656565">A blockquote paragraph.</text>
  <circle cx="370" cy="280" r="3"/><text x="384" y="285" font-family="serif" font-size="16">bullet item</text>
  <rect x="329" y="320" width="551" height="26" fill="#dadada"/>
  <text x="341" y="338" font-family="monospace" font-size="13">const x = 1; // code block</text>
  <rect x="300" y="370" width="580" height="32" fill="#dadada"/>
  <text x="306" y="391" font-family="serif" font-weight="bold">COL A</text>
  <text x="600" y="391" font-family="serif" font-weight="bold">COL B</text>
  <text x="306" y="423" font-family="serif">a</text><text x="600" y="423" font-family="serif">b</text>
  <!-- status bar -->
  <line x1="240" y1="610" x2="960" y2="610" stroke="#ddd"/>
  <text x="252" y="630">&lt;</text>
  <text x="280" y="630">&lt;/&gt;</text>
  <text x="810" y="630">▲ EN-GB</text>
  <text x="880" y="630">64 Words</text>
  <text x="560" y="630" fill="#888" font-size="11">status bar 30px</text>
</svg>
