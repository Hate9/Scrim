<svg xmlns="http://www.w3.org/2000/svg" width="480" height="380" viewBox="0 0 480 380" font-family="sans-serif" font-size="14">
  <title>Quick open (Mod+P)</title>
  <rect x="20" y="4" width="420" height="350" fill="#f3f2ee" stroke="#bbb"/>
  <rect x="24" y="8" width="412" height="26" fill="none" stroke="#ccc"/>
  <text x="32" y="26" fill="#888">Search by file name</text>
  <rect x="24" y="38" width="404" height="40" fill="rgba(32,43,51,0.63)"/>
  <text x="44" y="55" fill="#fff">other-note.md</text>
  <text x="44" y="71" fill="#ddd" font-size="11">/home/user/notes/…/projects/</text>
  <text x="44" y="95">nested.md</text>
  <text x="44" y="111" fill="#888" font-size="11">/home/user/notes/…/folder/</text>
  <text x="44" y="135">design.md</text>
  <text x="44" y="151" fill="#888" font-size="11">/home/user/notes/</text>
  <rect x="430" y="38" width="6" height="60" fill="#bbb"/>
  <text x="44" y="300" fill="#888" font-size="11">rows 40px · up to 8 visible · selected row uses --active-file-* colors</text>
</svg>
