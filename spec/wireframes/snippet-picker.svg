<svg xmlns="http://www.w3.org/2000/svg" width="480" height="220" viewBox="0 0 480 220" font-family="sans-serif" font-size="14">
  <title>Snippet picker</title>
  <rect x="30" y="10" width="420" height="190" fill="#f3f2ee" stroke="rgba(128,128,128,0.4)" rx="6"/>
  <text x="42" y="38">rd</text>
  <line x1="30" y1="50" x2="450" y2="50" stroke="rgba(128,128,128,0.3)"/>
  <rect x="30" y="56" width="420" height="28" fill="rgba(100,140,255,0.25)"/>
  <text x="42" y="75">Red span</text>
  <text x="250" y="75" font-family="monospace" font-size="12" fill="#888">&lt;span style="color:red"&gt;$0…</text>
